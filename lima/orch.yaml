# Lima VM template for orch — single VM for all Claude Code sessions.
#
# Usage:
#   limactl create --name orch lima/orch.yaml
#   limactl start orch
#   limactl shell orch
#
# Requirements: Lima >= 1.0, macOS with Apple Virtualization.framework

vmType: vz
cpus: 12
memory: "48GiB"
disk: "300GiB"

images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"

# virtiofs mounts — same paths as host, no translation needed
mounts:
  - location: "~/Apps"
    writable: true
  - location: "~/.claude"
    writable: true
  # Note: ~/.claude.json is a file, not a directory, so virtiofs can't mount it.
  # The VM instead uses CLAUDE_CONFIG_DIR=/Users/joshuaodmark/.claude (set in
  # provisioning below), which causes Claude Code to read/write
  # ~/.claude/.claude.json instead — that IS mounted, so host and VM share state.
  - location: "~/.ssh"
    writable: false
  - location: "~/.orch"
    writable: true
  - location: "~/Screenshots"
    writable: false

mountType: virtiofs

ssh:
  forwardAgent: true

# Auto-forward dev server and service ports
portForwards:
  - guestPortRange: [3000, 9999]
    hostIP: "127.0.0.1"
  - guestPort: 5900
    hostIP: "127.0.0.1"
  - guestPort: 6443
    hostIP: "127.0.0.1"

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux

      export DEBIAN_FRONTEND=noninteractive

      # ── Core tools ──
      apt-get update
      apt-get install -y \
        git curl wget build-essential tmux xclip jq unzip \
        ca-certificates gnupg lsb-release software-properties-common unzip

      # ── direnv ──
      apt-get install -y direnv

      # ── Docker Engine ──
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
        | tee /etc/apt/sources.list.d/docker.list > /dev/null
      apt-get update
      apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

      # ── gh CLI ──
      curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
        | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
      chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
        | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
      apt-get update
      apt-get install -y gh

      # ── Shared native services (PostgreSQL 17 + pgvector, Redis) ──
      # Delegated to an idempotent script so it can be re-run against
      # existing VMs (new services added later won't require a VM rebuild).
      bash /Users/joshuaodmark/Apps/orch/lima/provision-services.sh

      # ── k3s (provides kubectl as /usr/local/bin/kubectl symlink) ──
      curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--write-kubeconfig-mode 644" sh -

      # ── Tailscale ──
      curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg \
        -o /usr/share/keyrings/tailscale-archive-keyring.gpg
      curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list \
        -o /etc/apt/sources.list.d/tailscale.list
      apt-get update
      apt-get install -y tailscale

      # ── VNC (optional GUI) ──
      apt-get install -y tigervnc-standalone-server || true

  - mode: user
    script: |
      #!/bin/bash
      set -eux

      # ── mise (manages Python, Node, Go, etc. per-project) ──
      curl https://mise.run | sh
      echo 'eval "$($HOME/.local/bin/mise activate bash)"' >> ~/.bashrc

      # ── direnv hook ──
      echo 'eval "$(direnv hook bash)"' >> ~/.bashrc

      # ── Bun runtime (required by claude-mem plugin) ──
      curl -fsSL https://bun.sh/install | bash
      echo 'export BUN_INSTALL="$HOME/.bun"' >> ~/.bash_env
      echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> ~/.bash_env

      # ── Claude Code (native installer; user-writable, supports auto-update) ──
      # Installs to ~/.local/share/claude/versions/<ver> with ~/.local/bin/claude
      # symlink. Self-updates without sudo. Do NOT install via npm-global —
      # that lands at /usr/lib/node_modules and blocks auto-update.
      curl -fsSL https://claude.ai/install.sh | bash
      # Make the native install discoverable in orch sessions, which source only
      # ~/.bash_env (not .profile/.bashrc). Without this PATH addition, orch
      # sessions report "claude: not found" even though the binary exists.
      echo 'export PATH="$HOME/.local/bin:$PATH"' >> ~/.bash_env

      # ── Claude config dir (use host-mounted .claude so JSONL files are visible to host) ──
      # Must go in .bash_env (sourced from .profile) not .bashrc, because
      # .bashrc has an interactive-only guard that blocks non-interactive shells.
      echo 'export CLAUDE_CONFIG_DIR=/Users/joshuaodmark/.claude' >> ~/.bash_env

      # ── Zyte API key (for scraping; same key the host's asha daemon uses) ──
      # Bootstrap from business-scorer-api/.env (host-mounted, survives VM
      # rebuild) into a VM-local canonical file the bash_env line below reads.
      # If business-scorer-api/.env disappears, drop the key into
      # ~/.config/zyte/api_key by hand and the next session picks it up.
      if [ ! -s "$HOME/.config/zyte/api_key" ] && [ -r /Users/joshuaodmark/Apps/business-scorer-api/.env ]; then
        mkdir -p "$HOME/.config/zyte"
        awk -F= '/^ZYTE_API_KEY=/{print $2; exit}' /Users/joshuaodmark/Apps/business-scorer-api/.env > "$HOME/.config/zyte/api_key"
        chmod 600 "$HOME/.config/zyte/api_key"
      fi
      echo '[ -r "$HOME/.config/zyte/api_key" ] && export ZYTE_API_KEY="$(cat "$HOME/.config/zyte/api_key")"' >> ~/.bash_env

      # ── Claude Code OAuth credentials (Max-plan billed) ──
      # VM Claude reads OAuth creds from $CLAUDE_CONFIG_DIR/.credentials.json
      # (which is the host's ~/.claude/.credentials.json via virtiofs). Host
      # macOS Claude transparently refreshes its token via Keychain every ~8h,
      # which rotates the refresh_token server-side and leaves the file copy
      # stale — breaking the next VM session that needs to refresh. To fix:
      # run `orch credbroker install` on the host. That installs a launchd
      # agent that mirrors Keychain → file whenever the host refreshes.

      # ── Docker group ──
      sudo usermod -aG docker "$USER"

      # ── Git defaults ──
      git config --global init.defaultBranch main
      git config --global pull.rebase false

      # ── tmux config for orch sessions ──
      cat > ~/.tmux.conf << 'TMUX'
      set -g mouse on
      set -g history-limit 50000
      set -g default-terminal "xterm-256color"
      set -ga terminal-overrides ",xterm-256color:RGB"
      set -g allow-passthrough on
      set -g set-clipboard on
      set -g status-right "#S"
      TMUX

      # ── kubeconfig ──
      mkdir -p ~/.kube
      echo 'export KUBECONFIG=/etc/rancher/k3s/k3s.yaml' >> ~/.bashrc
